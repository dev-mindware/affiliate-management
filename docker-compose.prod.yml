version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mindware_affiliate_postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindware_affiliates}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_prod}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - affiliate-network

  redis:
    image: redis:alpine
    container_name: mindware_affiliate_redis_prod
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - affiliate-network

  api:
    image: ${DOCKERHUB_USERNAME:-mindware2025}/mindgest-affiliate-api:latest
    container_name: mindgest-affiliate-api-prod
    pull_policy: always
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
      PORT: 3333
      PROJECT_NAME: ${PROJECT_NAME:-Mindware Affiliate System}
      API_PREFIX: ${API_PREFIX:-/api}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_prod}@postgres:5432/${POSTGRES_DB:-mindware_affiliates}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-True}
      MAIL_SSL_TLS: ${MAIL_SSL_TLS:-False}
      USE_CREDENTIALS: ${USE_CREDENTIALS:-True}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS}
      APP_AFFILIATE_URL: ${APP_AFFILIATE_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD}
    depends_on:
      - postgres
      - redis
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - affiliate-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  affiliate-network:
    driver: bridge
