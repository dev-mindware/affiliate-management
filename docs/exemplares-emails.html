<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplares de Emails — Portal de Parceiros Mindgest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #9956f6;
      --primary-dark: #7c3aed;
      --bg: #0d0f17;
      --sidebar-bg: #141724;
      --card-bg: #1e2235;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2e354f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 380px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title span { color: var(--primary); }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      background-color: rgba(153, 86, 246, 0.2);
      color: #c084fc;
      margin-top: 6px;
    }
    .template-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .template-item {
      padding: 14px 16px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      color: var(--text);
    }
    .template-item:hover {
      background: rgba(153, 86, 246, 0.08);
      border-color: rgba(153, 86, 246, 0.3);
    }
    .template-item.active {
      background: linear-gradient(135deg, rgba(153, 86, 246, 0.25) 0%, rgba(124, 58, 237, 0.2) 100%);
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(153, 86, 246, 0.2);
    }
    .template-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .template-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #090a0f;
      overflow: hidden;
    }
    .top-bar {
      padding: 16px 24px;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .preview-info {
      display: flex;
      flex-direction: column;
    }
    .subject-line {
      font-size: 14px;
      color: var(--text-muted);
    }
    .subject-line strong {
      color: #ffffff;
    }
    .device-controls {
      display: flex;
      gap: 8px;
      background: var(--bg);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .device-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s;
    }
    .device-btn.active {
      background: var(--primary);
      color: #fff;
    }
    .preview-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
      overflow-y: auto;
      background-color: #0b0d14;
    }
    .preview-frame-wrapper {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      transition: width 0.3s ease;
      overflow: hidden;
      width: 640px;
      min-height: 820px;
    }
    iframe {
      width: 100%;
      min-height: 820px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR COM A LISTA DE EMAILS -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand-title">Mindgest <span>Partners</span></div>
      <div class="badge">Catálogo Oficial de Emails</div>
    </div>

    <div class="template-list" id="templateList">
      <!-- Inserido dinamicamente via JS -->
    </div>
  </aside>

  <!-- ÁREA DE PRÉ-VISUALIZAÇÃO -->
  <main id="main">
    <div class="top-bar">
      <div class="preview-info">
        <div id="activeSubject" class="subject-line">Assunto: <strong>A carregar...</strong></div>
      </div>
      <div class="device-controls">
        <button class="device-btn active" onclick="setDevice('desktop')">🖥️ Desktop (640px)</button>
        <button class="device-btn" onclick="setDevice('mobile')">📱 Mobile (380px)</button>
      </div>
    </div>

    <div class="preview-container">
      <div class="preview-frame-wrapper" id="frameWrapper">
        <iframe id="previewFrame"></iframe>
      </div>
    </div>
  </main>

  <script>
    // Templates de email gerados

      {

        title: "1. Boas-vindas pós-cadastro",

        subject: "Bem-vindo ao Portal de Parceiros Mindware — Próximos Passos",
        getHtml: () => getOnboardingHtml()
      },
      {
        id: "approved",
        icon: "🎉",
        title: "2. Conta de Parceiro Aprovada",
        desc: "Código de parceiro oficial, link de login e orientações de início.",
        subject: "A sua conta no Portal de Parceiros Mindware foi Aprovada! 🎉",
        getHtml: () => getApprovedHtml()
      },
      {
        id: "marketing_boost",
        icon: "📈",
        title: "3. Reforço de Marketing (Poucos Clientes)",
        desc: "Alerta estratégico de poucos clientes, tabela de níveis até 38% e dicas práticas.",
        subject: "Aumente as suas comissões: Dicas e reforço de divulgação para o seu perfil 📈",
        getHtml: () => getMarketingBoostHtml()
      },
      {
        id: "password_reset",
        icon: "🔑",
        title: "4. Recuperação de Palavra-passe",
        desc: "Link e botão de segurança para redefinir senha com expiração de 1 hora.",
        subject: "Recuperação de Palavra-passe — Portal de Parceiros Mindware",
        getHtml: () => getPasswordResetHtml()
      },
      {
        id: "commission_earned",
        icon: "💰",
        title: "5. Nova Comissão Registada / Aprovada",
        desc: "Crédito de comissão em Kwanzas (Kz), cliente referido e acesso à carteira.",
        subject: "Nova Comissão de 25.000,00 Kz no Portal de Parceiros! 💰",
        getHtml: () => getCommissionEarnedHtml()
      },
      {
        id: "withdrawal_admin",
        icon: "🔔",
        title: "6. Pedido de Levantamento (Para Admin)",
        desc: "Alerta aos administradores com dados bancários e valor para transferência.",
        subject: "[Admin] Novo Pedido de Levantamento: 45.000,00 Kz - Jonatão Cardoso",
        getHtml: () => getWithdrawalAdminHtml()
      },
      {
        id: "withdrawal_approved",
        icon: "✅",
        title: "7. Levantamento Aprovado (Afiliado)",
        desc: "Confirmação de pagamento efetuado na conta bancária com anexo do comprovativo.",
        subject: "Levantamento de 45.000,00 Kz Aprovado com Sucesso! ✅",

      {
        id: "withdrawal_rejected",
        icon: "⚠️",
        title: "8. Levantamento Rejeitado (Afiliado)",
        desc: "Notificação com motivo da rejeição e devolução do saldo para a carteira.",
        subject: "Atualização sobre o seu Pedido de Levantamento — 45.000,00 Kz",
        getHtml: () => getWithdrawalRejectedHtml()

      {

        subject: "🏆 Parabéns! Subiu de Nível no Programa de Parceiros: SILVER (20% Recorrente)",
        getHtml: () => getLevelUpHtml()
      },
      {

        icon: "⚡",
        title: "10. Alerta de Proximidade (Falta 1 Cliente)",

        getHtml: () => getProximityAlertHtml()

      {

        title: "11. Prevenção Anti-Churn (Falha de Pagamento)",

        subject: "⚠️ Atenção: Falha no pagamento da mensalidade de um cliente seu (Mindgest)",
        getHtml: () => getClientPaymentFailedHtml()
      },
      {
        id: "withdrawal_threshold",
        icon: "🎯",
        title: "12. Limiar de Levantamento Atingido (5.000 Kz)",
        desc: "Notificação de saldo disponível suficiente para solicitar transferência bancária.",
        subject: "🎯 Saldo Disponível Atingiu o Mínimo de Levantamento: 12.500,00 Kz!",
        getHtml: () => getWithdrawalThresholdHtml()
      },
      {
        id: "certification_approved",
        icon: "🎓",
        title: "13. Certificação Comercial Aprovada",
        desc: "Desbloqueio do Plano Mindgest PRO e certificação comercial oficial.",
        subject: "🎓 Parabéns! A sua Certificação Comercial Mindgest foi Aprovada!",
        getHtml: () => getCertificationApprovedHtml()
      },
      {
        id: "monthly_statement",
        icon: "📊",
        title: "14. Extrato Mensal de Rendimentos",
        desc: "Resumo do mês com clientes ativos, comissões faturadas e saldo atual.",
        subject: "📊 O seu Extrato Mensal de Parceiro Mindgest — Setembro 2026",
        getHtml: () => getMonthlyStatementHtml()
      }
    ];

    let currentIdx = 0;

    function renderList() {
      const listEl = document.getElementById("templateList");
      listEl.innerHTML = "";
      templates.forEach((t, i) => {
        const item = document.createElement("button");
        item.className = "template-item" + (i === currentIdx ? " active" : "");
        item.onclick = () => selectTemplate(i);
        item.innerHTML = `
          <div class="template-title">${t.icon} ${t.title}</div>
          <div class="template-desc">${t.desc}</div>
        `;
        listEl.appendChild(item);
      });
    }

    function selectTemplate(idx) {
      currentIdx = idx;
      renderList();
      const t = templates[idx];
      document.getElementById("activeSubject").innerHTML = `Assunto: <strong>${t.subject}</strong>`;
      const frame = document.getElementById("previewFrame");
      frame.srcdoc = t.getHtml();
    }

    function setDevice(type) {
      document.querySelectorAll(".device-btn").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
      const wrapper = document.getElementById("frameWrapper");
      if (type === "mobile") {
        wrapper.style.width = "380px";
      } else {
        wrapper.style.width = "640px";
      }
    }

    // Gerador do layout base Mindgest
    function baseLayout(title, badge, content, ctaText, ctaUrl) {
      return `
<!DOCTYPE html>

    .cta-btn { background-color: #9956f6; color: #ffffff !important; padding: 13px 32px; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; display: inline-block; box-shadow: 0 4px 12px rgba(153, 86, 246, 0.3); }

</body>
</html>
      `;
    }

    function getMarketingBoostHtml() {
      const content = `
        <div class="alert-box">
          🚀 <strong>Dica Estratégica:</strong> Aumente as suas comissões recorrentes no Programa de Parceiros.
        </div>
