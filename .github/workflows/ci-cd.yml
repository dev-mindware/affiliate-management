name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build-check:
    name: 🧪 Test & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/db"

      - name: Run Tests
        run: pnpm test --runInBand
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run Build Check
        run: pnpm build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  docker-build-push:
    name: 🏗️ Build & Push to Docker Hub
    needs: test-and-build-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mindgest-affiliate-api:latest

  deploy-dokploy:
    name: 🚀 Trigger Dokploy Deploy
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Production Deploy
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{}' "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
