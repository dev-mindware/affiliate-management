name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.32.1

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'
        cache-dependency-path: 'api/pnpm-lock.yaml'

    - name: Configure pnpm
      run: pnpm config set ignore-scripts false

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Generate Prisma Client
      run: pnpm prisma generate
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/db"

    - name: Build
      run: pnpm run build

  docker-build-push:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm (for approving builds)
      uses: pnpm/action-setup@v4
      with:
        version: 10.32.1

    - name: Approve pnpm ignored builds
      working-directory: ./api
      run: |
        pnpm config set ignore-scripts false
        pnpm approve-builds --all || true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ./api
        file: ./api/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/mindgest-affiliate-api:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/mindgest-affiliate-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Dokploy Deployment
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{}' "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
